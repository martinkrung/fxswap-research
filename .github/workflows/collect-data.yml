name: Collect FXSwap Data Hourly

on:
  schedule:
    # Run every hour at minute 19
    - cron: '19 9-18/2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  collect-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git operations

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Collect data for all pools
        env:
          RPC_BASE: ${{ secrets.ALCHEMY_RPC_URL_BASE }}
          RPC_ETHEREUM: ${{ secrets.ALCHEMY_RPC_URL_ETHEREUM }}
        run: |
          # Create a log file with timestamp
          LOG_FILE="logs/data_collection_$(date +%Y%m%d_%H%M%S).log"
          mkdir -p logs

          echo "Starting data collection at $(date)" | tee -a "$LOG_FILE"
          echo "========================================" | tee -a "$LOG_FILE"

          echo "Running Base data collection..." | tee -a "$LOG_FILE"
          python tools/get_data_base.py 2>&1 | tee -a "$LOG_FILE"

          echo "" | tee -a "$LOG_FILE"
          echo "========================================" | tee -a "$LOG_FILE"
          echo "Data collection completed at $(date)" | tee -a "$LOG_FILE"

          # Save log file path for later use
          echo "LOG_FILE=$LOG_FILE" >> $GITHUB_ENV

      - name: Check for changes
        id: check_changes
        run: |
          # Check if there are any changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git status
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Add all parquet files and config changes
          git add data/**/*.parquet
          git add config/fxswaps.json

          # Create commit with timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "chore: automated data collection - $TIMESTAMP" \
                     -m "Collected data for all configured FXSwap pools and updated block metadata" \
                     -m "Workflow run: ${{ github.run_number }}"

          # Push changes
          git push

      - name: Upload log as artifact
        if: always()  # Upload logs even if the workflow fails
        uses: actions/upload-artifact@v4
        with:
          name: data-collection-log-${{ github.run_number }}
          path: logs/*.log
          retention-days: 30
