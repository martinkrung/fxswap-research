name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["Collect FXSwap Data Hourly"]
    types:
      - completed
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secrets
        run: |
          MISSING_SECRETS=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "❌ CLOUDFLARE_API_TOKEN is missing"; MISSING_SECRETS=1; fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then echo "❌ CLOUDFLARE_ACCOUNT_ID is missing"; MISSING_SECRETS=1; fi
          if [ -z "${{ secrets.CLOUDFLARE_PROJECT_NAME }}" ]; then echo "❌ CLOUDFLARE_PROJECT_NAME is missing"; MISSING_SECRETS=1; fi
          if [ $MISSING_SECRETS -eq 1 ]; then exit 1; fi
          echo "✅ All required secrets are present."

      - name: Generate Plots and HTML
        run: |
          # Ensure plots directory exists
          mkdir -p plots
          python scripts/plot_refule.py --all

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: plots
          branch: ${{ github.ref_name }}
