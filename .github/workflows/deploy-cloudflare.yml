name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["Collect FXSwap Data Hourly"]
    types:
      - completed
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secrets
        run: |
          MISSING_SECRETS=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "❌ CLOUDFLARE_API_TOKEN is missing"; MISSING_SECRETS=1; fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then echo "❌ CLOUDFLARE_ACCOUNT_ID is missing"; MISSING_SECRETS=1; fi
          if [ -z "${{ secrets.CLOUDFLARE_PROJECT_NAME }}" ]; then echo "❌ CLOUDFLARE_PROJECT_NAME is missing"; MISSING_SECRETS=1; fi
          if [ $MISSING_SECRETS -eq 1 ]; then exit 1; fi
          echo "✅ All required secrets are present."

      - name: Generate Plots and HTML
        run: |
          echo "🚀 Starting plot and HTML generation..."
          mkdir -p plots
          python scripts/plot_refule.py --all
          echo "✅ Generation complete."

      - name: Commit and push plots
        run: |
          echo "📝 Checking for plot updates to commit..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add plots/
          
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to plots to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            echo "📤 Committing and pushing updates..."
            git commit -m "chore: update plots and html - $TIMESTAMP"
            git push
            echo "✅ Pushed to repository."
          fi

      - name: Deploy to Cloudflare Pages
        run: echo "🌐 Deploying to Cloudflare Pages..."

      - name: Wrangler Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy plots --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}
